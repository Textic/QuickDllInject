name: Build QuickDllInject

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch: x64
          - platform: Win32
            arch: x86
          - platform: ARM64
            arch: x64_arm64

    steps:
      - name: Checkout QuickDllInject
        uses: actions/checkout@v4

      - name: Checkout System Informer (SDK Headers)
        uses: actions/checkout@v4
        with:
          repository: winsiderss/systeminformer
          path: systeminformer
          depth: 1

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Compile QuickDllInject Plugin
        shell: pwsh
        run: |
          $siRoot = (Get-Item systeminformer).FullName + "\"
          msbuild QuickDllInject.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:SystemInformerRoot="$siRoot" /p:SpectreMitigation=false /nologo

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force
          $dll = (Get-ChildItem -Path "bin" -Filter "QuickDllInject.dll" -Recurse | Select-Object -First 1).FullName
          $pdb = (Get-ChildItem -Path "bin" -Filter "QuickDllInject.pdb" -Recurse | Select-Object -First 1).FullName
          Copy-Item $dll "dist/QuickDllInject-${{ matrix.platform }}.dll"
          Copy-Item $pdb "dist/QuickDllInject-${{ matrix.platform }}.pdb"
          Compress-Archive -Path $dll, $pdb -DestinationPath "dist/QuickDllInject-${{ matrix.platform }}.zip"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickDllInject-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
